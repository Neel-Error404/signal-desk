name: SignalDesk Hosted Review Gate

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - work/sd-006-release-communication
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ordered-review-gate:
    name: signaldesk-ordered-review-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact pull-request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure the mutable test runtime
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw "RUNNER_TEMP is required for the hosted PostgreSQL runtime."
          }
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "signaldesk-runtime"
          "SIGNALDESK_TEST_RUNTIME_ROOT=$runtimeRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install Python for the portable Elder capsule
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Prepare the verified Linux Elder runtime layout
        run: |
          $manifest = Get-Content -Raw ".elder/capsule/manifest.json" | ConvertFrom-Json
          $wheel = Join-Path $PWD $manifest.wheel
          $wheelRecord = $manifest.files.PSObject.Properties[$manifest.wheel].Value
          $wheelDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel).Hash.ToLowerInvariant()
          if ($wheelDigest -ne $wheelRecord.sha256) {
            throw "The Elder capsule wheel does not match its manifest."
          }

          $toolingRoot = Join-Path $PWD ".elder/runtime/tooling"
          python -m venv --clear $toolingRoot
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the Elder tooling environment." }
          $runtimePython = Join-Path $toolingRoot "bin/python"
          & $runtimePython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Failed to update the Elder tooling pip." }
          & $runtimePython -m pip install `
            $wheel `
            "azure-identity>=1.24,<2" `
            "mem0ai==2.0.17" `
            "python-dotenv>=1.1,<2" `
            "qdrant-client==1.19.0"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the Elder tooling runtime." }

          $compatibilityDirectory = Join-Path $toolingRoot "Scripts"
          New-Item -ItemType Directory -Path $compatibilityDirectory -Force | Out-Null
          New-Item -ItemType SymbolicLink `
            -Path (Join-Path $compatibilityDirectory "python.exe") `
            -Target $runtimePython `
            -Force | Out-Null
          Set-Content `
            -LiteralPath (Join-Path $toolingRoot ".elder-wheel.sha256") `
            -Value $wheelDigest `
            -Encoding ascii

      - name: Install exact dependencies
        run: npm ci

      - name: Install exact actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}
          installed_version_output="$("$install_dir/actionlint" -version)"
          installed_version="${installed_version_output%%$'\n'*}"
          [[ "$installed_version" == "$ACTIONLINT_VERSION" ]]
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: SD-008 Docker archive adapter smoke
        run: npm run sd008:artifact-adapter -- --format text --mode hosted

      - name: Foundation
        run: npm run test:foundation

      - name: Component
        run: npm run test:component

      - name: Integration
        run: npm run test:integration

      - name: Workflow
        run: npm run test:workflow

      - name: Stress
        run: npm run test:stress

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Elder validation
        run: .\elder.ps1 validate
